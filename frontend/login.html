<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Employee Attendance System</title>
  <meta name="description" content="Login to the Employee Attendance Management System. Track your daily attendance, check in and check out." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="login-wrapper">
    <div class="card login-card scale-in">
      <!-- Logo -->
      <div class="login-header">
        <div class="login-logo">🕐</div>
        <h1>Attendance System</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Alert -->
      <div id="alert-message" class="alert"></div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@company.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-lg">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Cognito SDK -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>

  <!-- App Scripts -->
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already authenticated
    document.addEventListener("DOMContentLoaded", () => {
      if (isAuthenticated()) {
        if (isAdmin()) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "employee.html";
        }
        return;
      }

      // Login form handler
      const form = document.getElementById("login-form");
      const alertEl = document.getElementById("alert-message");
      const btnLogin = document.getElementById("btn-login");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          alertEl.className = "alert alert-error show";
          alertEl.textContent = "Please enter email and password.";
          return;
        }

        // Loading state
        btnLogin.disabled = true;
        btnLogin.innerHTML = '<span class="spinner"></span> Signing In...';
        alertEl.classList.remove("show");

        try {
          const payload = await login(email, password);
          const groups = payload["cognito:groups"] || [];

          // Redirect based on role
          if (groups.includes("admin")) {
            window.location.href = "admin.html";
          } else {
            window.location.href = "employee.html";
          }
        } catch (error) {
          let message = "Login failed. Please try again.";
          if (error.code === "NotAuthorizedException") {
            message = "Incorrect email or password.";
          } else if (error.code === "UserNotFoundException") {
            message = "Account not found.";
          } else if (error.code === "UserNotConfirmedException") {
            message = "Account not confirmed. Contact admin.";
          } else if (error.message) {
            message = error.message;
          }

          alertEl.className = "alert alert-error show";
          alertEl.textContent = message;

          btnLogin.disabled = false;
          btnLogin.innerHTML = "Sign In";
        }
      });
    });
  </script>

</body>
</html>
